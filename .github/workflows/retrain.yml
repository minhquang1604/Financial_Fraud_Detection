name: MLOps Retrain Pipeline

on:
  repository_dispatch:
    types: [drift_alert]
  workflow_dispatch:
    inputs:
      ref_ratio:
        description: 'Reference data ratio (0.0-1.0)'
        required: false
        type: number
        default: 0.75
      trigger_type:
        description: 'Trigger type'
        required: true
        type: choice
        options:
          - manual
          - scheduled
          - drift_alert

env:
  # Option 1: Self-hosted MLflow (use self-hosted runner on same network as MLflow)
  # MLFLOW_TRACKING_URI: http://your-mlflow-server:5000

  # Option 2: MLflow Tracking Server (set MLFLOW_TRACKING_URI in GitHub Secrets)
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

  # Option 3: AWS S3 for MLflow artifacts (uncomment and set secrets)
  # AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  # AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  # AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

  prepare-data:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Fetch LFS files
        run: git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run label joiner (gan nhan tu dataset goc)
        run: |
          python -m src.pipeline.label_joiner || echo "Label joiner skipped"

      - name: Prepare mixed data (75% Ref + 25% Labeled)
        env:
          REF_RATIO: ${{ github.inputs.ref_ratio || 0.75 }}
        run: |
          # Check if labeled data exists
          if [ -d "data/labeled" ] && [ $(ls -1 data/labeled/*.parquet 2>/dev/null | wc -l) -gt 0 ]; then
            python -m src.pipeline.prepare_data --ref-ratio $REF_RATIO
          elif [ -d "data/realtime" ] && [ $(ls -1 data/realtime/*.parquet 2>/dev/null | wc -l) -gt 0 ]; then
            python -m src.pipeline.label_joiner
            python -m src.pipeline.prepare_data --ref-ratio $REF_RATIO
          else
            echo "No labeled or realtime data found. Using reference data only."
            python -m src.pipeline.prepare_data --ref-ratio 1.0
          fi

      - name: Check data
        id: check-data
        run: |
          ls -la data/mixed/
          echo "mixed_files=$(ls -1 data/mixed/*.parquet 2>/dev/null | wc -l)" >> $GITHUB_OUTPUT

      - name: Upload mixed data
        if: steps.check-data.outputs.mixed_files > 0
        uses: actions/upload-artifact@v4
        with:
          name: mixed-data
          path: data/mixed/
          retention-days: 7

  retrain:
    needs: [setup, prepare-data]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Fetch LFS files
        run: git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download mixed data
        uses: actions/download-artifact@v4
        with:
          name: mixed-data
          path: data/mixed/
          merge: true

      - name: Run retrain pipeline (voi SMOTE)
        env:
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
        run: |
          python -m src.pipeline.retrain_pipeline

      - name: Evaluate model
        run: |
          python -c "
          import joblib
          model = joblib.load('model/fraud_model_retrain.pkl')
          print(f'Model metrics: {model.get(\"metrics\", {})}')
          print(f'SMOTE applied: {model.get(\"smote_applied\", False)}')
          "

      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: fraud-model
          path: model/
          retention-days: 30

  deploy:
    needs: retrain
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download model
        uses: actions/download-artifact@v4
        with:
          name: fraud-model
          path: model/

      - name: Deploy to staging
        run: |
          echo "Deploying model..."
          ls -la model/fraud_model_retrain.pkl

      - name: Record deployment
        run: |
          echo "Model deployed at $(date)"
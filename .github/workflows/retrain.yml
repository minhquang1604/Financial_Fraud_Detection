name: MLOps Retrain Pipeline

on:
  repository_dispatch:
    types: [drift_alert]
  workflow_dispatch:
    inputs:
      ref_ratio:
        description: 'Reference data ratio (0.0-1.0)'
        required: false
        type: number
        default: 0.75
      trigger_type:
        description: 'Trigger type'
        required: true
        type: choice
        options:
          - manual
          - scheduled
          - drift_alert

env:
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
  S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
  USE_S3: 'true'

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download all data from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          python -c "
          import os
          import boto3
          
          bucket = os.environ.get('S3_BUCKET_NAME', '')
          if not bucket:
              raise ValueError('S3_BUCKET_NAME is not set! Please configure GitHub Secret S3_BUCKET_NAME')
          
          print(f'Using bucket: {bucket}')
          
          s3 = boto3.client('s3',
              region_name=os.environ.get('AWS_DEFAULT_REGION', 'us-east-1'),
              aws_access_key_id=os.environ.get('AWS_ACCESS_KEY_ID'),
              aws_secret_access_key=os.environ.get('AWS_SECRET_ACCESS_KEY')
          )
          
          os.makedirs('data/train', exist_ok=True)
          os.makedirs('data/labeled', exist_ok=True)
          os.makedirs('data/realtime', exist_ok=True)
          os.makedirs('data/raw', exist_ok=True)
          
          # Download train data
          print('=== TRAIN DATA ===')
          response = s3.list_objects_v2(Bucket=bucket, Prefix='data/train/')
          if 'Contents' in response and len(response['Contents']) > 0:
              keys = [item['Key'] if isinstance(item, dict) else item for item in response['Contents']]
              keys = sorted([k for k in keys if not k.endswith('/')])
              latest_key = keys[-1]
              local_file = 'data/train/' + latest_key.split('/')[-1]
              s3.download_file(bucket, latest_key, local_file)
              print('Downloaded train: ' + latest_key)
          else:
              print('ERROR: No train data in S3 - cannot proceed!')
              exit(1)
          
          # Download ALL realtime data
          print('=== REALTIME DATA ===')
          response = s3.list_objects_v2(Bucket=bucket, Prefix='data/realtime/')
          if 'Contents' in response and len(response['Contents']) > 0:
              keys = [item['Key'] if isinstance(item, dict) else item for item in response['Contents']]
              keys = sorted([k for k in keys if not k.endswith('/')])
              print('Found ' + str(len(keys)) + ' realtime files in S3')
              for key in keys:
                  local_file = 'data/realtime/' + key.split('/')[-1]
                  s3.download_file(bucket, key, local_file)
                  print('Downloaded: ' + key)
              print('Total realtime files: ' + str(len(keys)))
          else:
              print('WARNING: No realtime data found in S3 - will skip labeling step')

          # Download raw reference (creditcard.csv)
          print('=== RAW DATA ===')
          response = s3.list_objects_v2(Bucket=bucket, Prefix='data/raw/')
          if 'Contents' in response and len(response['Contents']) > 0:
              csv_files = []
              for item in response['Contents']:
                  key = item['Key'] if isinstance(item, dict) else item
                  if key.endswith('.csv'):
                      csv_files.append(key)
              for key in csv_files:
                  local_file = 'data/raw/' + key.split('/')[-1]
                  s3.download_file(bucket, key, local_file)
                  print('Downloaded: ' + key)
          else:
              print('ERROR: No raw reference data in S3 - needed for labeling!')
              exit(1)
          "

      - name: Check downloaded data
        run: |
          echo "=== TRAIN DATA ==="
          ls -la data/train/ 2>/dev/null || echo "No train data"
          
          echo "=== REALTIME DATA ==="
          ls -la data/realtime/ 2>/dev/null | head -10 || echo "No realtime data"
          echo "Realtime file count: $(ls -1 data/realtime/*.parquet 2>/dev/null | wc -l)"
          
          echo "=== RAW DATA ==="
          ls -la data/raw/ 2>/dev/null || echo "No raw data"

      - name: Run Label Joiner
        run: |
          REALTIME_COUNT=$(ls -1 data/realtime/*.parquet 2>/dev/null | wc -l)
          echo "Realtime files available: $REALTIME_COUNT"
          
          if [ "$REALTIME_COUNT" -gt 0 ]; then
            echo "Running label joiner..."
            python -m src.pipeline.label_joiner
          else
            echo "No realtime files - skipping label joiner"
          fi

      - name: Check labeled data and prepare mixed data
        env:
          REF_RATIO: ${{ github.event.inputs.ref_ratio || 0.75 }}
        run: |
          LABELED_COUNT=$(ls -1 data/labeled/*.parquet 2>/dev/null | wc -l)
          echo "Labeled files available: $LABELED_COUNT"
          
          echo "=== Current data ==="
          echo "Train files: $(ls -1 data/train/*.parquet 2>/dev/null | wc -l)"
          echo "Labeled files: $LABELED_COUNT"
          echo "Mixed files: $(ls -1 data/mixed/*.parquet 2>/dev/null | wc -l)"
          
          python -m src.pipeline.prepare_data --ref-ratio ${{ github.event.inputs.ref_ratio || 0.75 }}

      - name: Upload mixed data to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          python -c "
          import os
          import boto3
          from datetime import datetime
          
          bucket = os.environ.get('S3_BUCKET_NAME', '')
          if not bucket:
              print('WARNING: S3_BUCKET_NAME not set, skipping upload')
              exit(0)
          
          s3 = boto3.client('s3',
              region_name=os.environ.get('AWS_DEFAULT_REGION', 'us-east-1'),
              aws_access_key_id=os.environ.get('AWS_ACCESS_KEY_ID'),
              aws_secret_access_key=os.environ.get('AWS_SECRET_ACCESS_KEY')
          )
          
          version = datetime.now().strftime('%Y%m%d_%H%M%S')
          
          for f in os.listdir('data/mixed'):
              if f.endswith('.parquet'):
                  local_path = f'data/mixed/{f}'
                  s3_key = f'data/mixed/mixed_train_{version}.parquet'
                  s3.upload_file(local_path, bucket, s3_key)
                  print(f'Uploaded: {s3_key}')
          "

      - name: Run retrain pipeline
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          USE_S3: 'true'
        run: |
          echo "=== DATA SUMMARY ==="
          echo "Train files: $(ls -1 data/train/*.parquet 2>/dev/null | wc -l)"
          echo "Labeled files: $(ls -1 data/labeled/*.parquet 2>/dev/null | wc -l)"
          echo "Mixed files: $(ls -1 data/mixed/*.parquet 2>/dev/null | wc -l)"
          
          python -m src.pipeline.retrain_pipeline

      - name: Upload model to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          python -c "
          import os
          import boto3
          from datetime import datetime
          
          bucket = os.environ.get('S3_BUCKET_NAME', '')
          if not bucket:
              print('WARNING: S3_BUCKET_NAME not set, skipping upload')
              exit(0)
          
          s3 = boto3.client('s3',
              region_name=os.environ.get('AWS_DEFAULT_REGION', 'us-east-1'),
              aws_access_key_id=os.environ.get('AWS_ACCESS_KEY_ID'),
              aws_secret_access_key=os.environ.get('AWS_SECRET_ACCESS_KEY')
          )
          
          version = datetime.now().strftime('%Y%m%d_%H%M%S')
          
          for f in os.listdir('model'):
              if f.endswith('.pkl'):
                  local_path = f'model/{f}'
                  s3_key = f'model/fraud_model_{version}.pkl'
                  s3.upload_file(local_path, bucket, s3_key)
                  print(f'Uploaded model: {s3_key}')
          "

      - name: Log results
        run: |
          echo "Retrain completed successfully"
          echo "Model artifacts uploaded to S3 bucket: ${{ secrets.S3_BUCKET_NAME }}"
          echo "Check MLflow at: ${{ secrets.MLFLOW_TRACKING_URI }}"
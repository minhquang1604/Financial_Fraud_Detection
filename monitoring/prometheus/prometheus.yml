global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'fraud-detection-api'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          service: 'fraud-detection-api'
          environment: 'production'

  - job_name: 'fraud-detection-monitoring'
    static_configs:
      - targets: ['host.docker.internal:8001']
        labels:
          service: 'fraud-detection-monitoring'
          environment: 'production'